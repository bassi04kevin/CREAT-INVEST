<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREA INVEST — Votre avis</title>
<style>
  :root{
    --teal-900:#0C3B37; --red-600:#D32330; --red-700:#B01D28; --red-100:#F7DCDE;
    --cream-50:#F4F1E8; --paper:#FFFFFF;
    --ink-900:#1B2624; --ink-500:#6B7A76; --ink-300:#9AA6A2; --mint-50:#EAF3F0;
    --line:#DFE6E2; --danger:#B54A3C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;background:var(--cream-50);margin:0;color:var(--ink-900);display:flex;justify-content:center;}
  .app{width:100%;max-width:480px;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}
  .header{background:linear-gradient(160deg, #5C6461 0%, #14161A 100%);padding:30px 22px 28px;flex-shrink:0;display:flex;align-items:center;gap:14px;}
  .header .brand{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:13px;font-weight:600;color:var(--red-100);letter-spacing:0.04em;margin-bottom:7px;}
  .header .title{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:20px;font-weight:600;color:#fff;line-height:1.3;}
  .header-logo{width:50px;height:50px;object-fit:contain;flex-shrink:0;border-radius:8px;background:#3A3F3E;padding:5px;}
  .progress{display:flex;gap:5px;padding:14px 22px 0;flex-shrink:0;}
  .progress .dot{height:4px;flex:1;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress .dot.filled{background:var(--red-600);}
  .body{padding:22px;flex:1;}
  .step-label{font-size:12px;color:var(--ink-500);font-weight:500;margin-bottom:4px;}
  .agence-list{display:flex;flex-direction:column;gap:10px;}
  .agence-item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s, background .15s;}
  .agence-item:hover{border-color:var(--red-600);}
  .agence-item.selected{border-color:var(--red-600);background:var(--red-100);}
  .agence-icon{width:36px;height:36px;border-radius:10px;background:var(--mint-50);display:flex;align-items:center;justify-content:center;color:var(--teal-900);font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:600;font-size:13px;flex-shrink:0;}
  .agence-item.selected .agence-icon{background:var(--red-600);color:#fff;}
  .agence-name{font-weight:500;font-size:14.5px;}
  .conseiller-label{font-weight:500;font-size:14.5px;color:var(--ink-900);margin-bottom:10px;line-height:1.4;}
  select.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14.5px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;color:var(--ink-900);outline:none;background:var(--paper);-webkit-appearance:none;appearance:none;}
  select.field:focus{border-color:var(--red-600);}

  .qblock{margin-bottom:26px;}
  .qblock:last-child{margin-bottom:6px;}
  .qtitle{font-weight:500;font-size:14px;margin-bottom:10px;line-height:1.4;}

  /* Boutons (questions catégorielles) */
  .qoptions{display:flex;flex-direction:column;gap:8px;}
  .qoption{border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13.5px;color:var(--ink-900);cursor:pointer;transition:border-color .15s, background .15s;}
  .qoption:hover{border-color:var(--red-600);}
  .qoption.selected{border-color:var(--red-600);background:var(--red-100);font-weight:500;}
  .qfollowup{margin-top:10px;}
  .qtextarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13.5px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;resize:none;outline:none;}
  .qtextarea:focus{border-color:var(--red-600);}

  /* Jauges (questions à échelle qualitative + les 5 anciens critères 0-10) */
  .crit-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .crit-value{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:600;font-size:13px;color:var(--red-700);text-align:right;max-width:55%;}
  .crit-desc{font-size:12px;color:var(--ink-500);margin-bottom:10px;line-height:1.4;}
  .gauge{position:relative;height:8px;background:var(--line);border-radius:4px;margin-bottom:6px;}
  .gauge-fill{position:absolute;left:0;top:0;bottom:0;background:var(--red-600);border-radius:4px;transition:width .12s ease;}
  .gauge input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;background:transparent;position:relative;z-index:2;margin:0;}
  .gauge input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--red-700);cursor:pointer;margin-top:-5px;}
  .gauge input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--red-700);cursor:pointer;}
  .gauge input[type=range]::-webkit-slider-runnable-track{height:8px;background:transparent;}
  .gauge-ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-300);}

  .textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14px;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;resize:none;outline:none;}
  .textarea:focus{border-color:var(--red-600);}
  .footer{padding:16px 22px 26px;flex-shrink:0;display:flex;gap:10px;border-top:1px solid var(--line);}
  .btn{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-weight:600;font-size:14px;border-radius:12px;padding:13px 0;text-align:center;cursor:pointer;border:none;flex:1;transition:opacity .15s, transform .1s;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--red-600);color:#fff;}
  .btn-primary:disabled{background:var(--line);color:var(--ink-300);cursor:not-allowed;}
  .btn-ghost{background:var(--mint-50);color:var(--red-700);flex:0 0 96px;}
  .qr-wrap{flex:1;display:flex;flex-direction:column;align-items:center;padding:34px 26px 10px;text-align:center;}
  .qr-logo{width:78px;height:auto;margin-bottom:16px;}
  .qr-title{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:19px;font-weight:600;margin:0 0 8px;}
  .qr-sub{font-size:13px;color:var(--ink-500);line-height:1.5;max-width:280px;margin-bottom:22px;}
  .qr-photo{width:100%;flex:1;min-height:160px;border-radius:16px;overflow:hidden;margin-top:6px;}
  .qr-photo img{width:100%;height:100%;object-fit:cover;display:block;}
  .center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;}
  .check-circle{width:64px;height:64px;border-radius:50%;background:var(--teal-900);display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
  .check-circle svg{width:28px;height:28px;}
  .thanks-title{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:19px;font-weight:600;margin:0 0 8px;}
  .thanks-sub{font-size:13.5px;color:var(--ink-500);line-height:1.55;max-width:280px;}
  .thanks-slogan{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;font-size:12.5px;font-weight:600;color:var(--red-600);letter-spacing:0.03em;margin-top:22px;max-width:260px;}
  .error-text{color:var(--danger);font-size:12px;margin-top:6px;display:none;}
</style>
</head>

const totalSteps = 5 + NB_SECTIONS + 1;

function progressHTML(current){
  let dots = '';
  for(let i=1;i<totalSteps-1;i++){ dots += '<div class="dot ' + (i<=current?'filled':'') + '"></div>'; }
  return '<div class="progress">' + dots + '</div>';
}

function headerHTML(title){

}

function conseillerOptions(){
  const liste = CONSEILLERS[state.agence] || [];
  let opts = '<option value="">Je ne connais pas son nom</option>';
  liste.forEach(function(nom){
    opts += '<option value="' + nom + '" ' + (state.conseiller===nom?'selected':'') + '>' + nom + '</option>';
  });
  return opts;
}

// ---- Jauge numérique 0-10 (les 5 anciens critères) ----
function gaugeRowNumeric(crit){
  const val = state.notes[crit.id];
  return '<div class="qblock">'
    + '<div class="crit-top"><span class="qtitle" style="margin-bottom:0">' + crit.name + '</span><span class="crit-value" id="val-' + crit.id + '">' + val + '/10</span></div>'
    + '<div class="crit-desc">' + crit.desc + '</div>'
    + '<div class="gauge"><div class="gauge-fill" id="fill-' + crit.id + '" style="width:' + (val*10) + '%"></div>'
    + '<input type="range" min="0" max="10" step="1" value="' + val + '" oninput="updateCritNumeric(\'' + crit.id + '\', this.value)"></div>'
    + '<div class="gauge-ends"><span>Très faible</span><span>Excellent</span></div>'
    + '</div>';
}
function updateCritNumeric(id, val){
  state.notes[id] = Number(val);
  document.getElementById('val-'+id).textContent = val+'/10';
  document.getElementById('fill-'+id).style.width = (val*10)+'%';
}

// ---- Jauge qualitative à curseur (options textuelles, pire -> mieux) ----
function defaultSliderIndex(n){ return Math.floor(n/2); }

function gaugeRowQualitative(q){
  if(state.reponses[q.id] === undefined){
    state.reponses[q.id] = q.options[defaultSliderIndex(q.options.length)];
  }
  const idx = q.options.indexOf(state.reponses[q.id]);
  const max = q.options.length - 1;
  const pct = max > 0 ? (idx / max) * 100 : 0;
  return '<div class="qblock">'
    + '<div class="crit-top"><span class="qtitle" style="margin-bottom:0">' + q.title + '</span><span class="crit-value" id="val-' + q.id + '">' + q.options[idx] + '</span></div>'
    + '<div class="gauge"><div class="gauge-fill" id="fill-' + q.id + '" style="width:' + pct + '%"></div>'
    + '<input type="range" min="0" max="' + max + '" step="1" value="' + idx + '" oninput="updateQualitative(\'' + q.id + '\', this.value)"></div>'
    + '<div class="gauge-ends"><span>' + q.options[0] + '</span><span>' + q.options[max] + '</span></div>'
    + '</div>';
}
function updateQualitative(qid, idxStr){
  const q = QUESTIONS.find(function(x){ return x.id === qid; });
  const idx = Number(idxStr);
  const label = q.options[idx];
  state.reponses[qid] = label;
  document.getElementById('val-'+qid).textContent = label;
  const max = q.options.length - 1;
  document.getElementById('fill-'+qid).style.width = (max>0 ? (idx/max)*100 : 0) + '%';
}

// ---- Boutons (questions catégorielles) + texte libre ----
function questionBlockButtons(q){
  const current = state.reponses[q.id];
  let html = '<div class="qblock" data-qid="' + q.id + '"><div class="qtitle">' + q.title + '</div>';
  if(q.type === 'choice'){
    html += '<div class="qoptions">';
    q.options.forEach(function(opt){
      const sel = current === opt ? ' selected' : '';
      html += '<div class="qoption' + sel + '" onclick="selectOption(\'' + q.id + '\',\'' + opt.replace(/'/g,"\\'") + '\')">' + opt + '</div>';
    });
    html += '</div>';
    if(q.followUp){
      const show = q.followUp.showIfValue === null || current === q.followUp.showIfValue;
      if(show){
        const val = state.reponses[q.followUp.id] || '';
        html += '<div class="qfollowup"><textarea class="qtextarea" placeholder="' + q.followUp.title + '" oninput="state.reponses[\'' + q.followUp.id + '\']=this.value">' + val + '</textarea></div>';
      }
    }
  } else if(q.type === 'text'){
    const val = current || '';
    html += '<textarea class="qtextarea" placeholder="Réponse libre (facultatif)" oninput="state.reponses[\'' + q.id + '\']=this.value">' + val + '</textarea>';
  }
  html += '</div>';
  return html;
}

function questionBlockHTML(q){
  if(q.type === 'choice' && q.slider){ return gaugeRowQualitative(q); }
  return questionBlockButtons(q);
}

function selectOption(qid, value){
  state.reponses[qid] = value;
  render();
}

function questionsForSection(n){ return QUESTIONS.filter(function(q){ return q.section === n; }); }

function validateSection(n){
  const qs = questionsForSection(n);
  for(let i=0;i<qs.length;i++){
    if(qs[i].type === 'choice' && !qs[i].slider && !state.reponses[qs[i].id]){ return false; }
  }
  return true;
}

function render(){
  const content = document.getElementById('content');
  let html = '';

  if(step === 0){
    html = '<div class="qr-wrap">'
      + '<img class="qr-logo" src="' + LOGO_SRC + '" alt="CREA INVEST">'
      + '<p class="qr-title">Votre avis compte à mieux vous servir</p>'
      + '<p class="qr-sub">Merci de prendre quelques minutes pour évaluer votre expérience en agence aujourd\'hui.</p>'
      + '<div class="qr-photo"><img src="' + PHOTO_SRC + '" alt=""></div>'
      + '</div>'
      + '<div class="footer"><button class="btn btn-primary" onclick="next()">Commencer</button></div>';
  }
  else if(step === 1){
    html = headerHTML('Quelle agence avez-vous visitée aujourd\'hui ?')
      + progressHTML(1)
      + '<div class="body"><div class="step-label">Informations générales · 1 sur 2</div>'
      + '<div class="agence-list">' + AGENCES.map(function(a){
          return '<div class="agence-item ' + (state.agence===a.code?'selected':'') + '" onclick="selectAgence(\'' + a.code + '\')">'
            + '<div class="agence-icon">' + a.code.split('-')[0].slice(0,2) + '</div><div class="agence-name">' + a.nom + '</div></div>';
        }).join('') + '</div>'
      + '<div class="error-text" id="err-agence">Sélectionnez votre agence pour continuer.</div></div>'
      + '<div class="footer"><button class="btn btn-ghost" onclick="prev()">Retour</button>'
      + '<button class="btn btn-primary" onclick="validateAgence()">Continuer</button></div>';
  }
  else if(step === 2){
    html = headerHTML('Qui vous a reçu(e) ?')
      + progressHTML(2)
      + '<div class="body"><div class="step-label">Informations générales · 2 sur 2</div>'
      + '<div class="conseiller-label">Sélectionnez le nom de votre interlocuteur si vous le connaissez.</div>'
      + '<select class="field" onchange="state.conseiller=this.value">' + conseillerOptions() + '</select></div>'
      + '<div class="footer"><button class="btn btn-ghost" onclick="prev()">Retour</button>'
      + '<button class="btn btn-primary" onclick="next()">Continuer</button></div>';
  }
  else if(step === 3){
    html = headerHTML('Accueil et posture')
      + progressHTML(3)
      + '<div class="body"><div class="step-label">Évaluation du service · 1 sur 2</div>'
      + criteresI.map(gaugeRowNumeric).join('') + '</div>'
      + '<div class="footer"><button class="btn btn-ghost" onclick="prev()">Retour</button>'
      + '<button class="btn btn-primary" onclick="next()">Continuer</button></div>';
  }
  else if(step === 4){
    html = headerHTML('Image et cadre')
      + progressHTML(4)
      + '<div class="body"><div class="step-label">Évaluation du service · 2 sur 2</div>'
      + criteresII.map(gaugeRowNumeric).join('') + '</div>'
      + '<div class="footer"><button class="btn btn-ghost" onclick="prev()">Retour</button>'
      + '<button class="btn btn-primary" onclick="next()">Continuer</button></div>';
  }
  else if(step >= 5 && step <= 4 + NB_SECTIONS){
    const sectionNum = step - 4;
    const qs = questionsForSection(sectionNum);
    const titles = {1:'Besoins et accueil', 2:'Difficultés rencontrées', 3:'Conseiller et produit', 4:'Délais et satisfaction', 5:'Votre avis'};
    const isLastSection = sectionNum === NB_SECTIONS;
    html = headerHTML(titles[sectionNum])
      + progressHTML(step)
      + '<div class="body"><div class="step-label">Votre expérience · ' + sectionNum + ' sur ' + NB_SECTIONS + '</div>'
      + qs.map(questionBlockHTML).join('')
      + '<div class="error-text" id="err-section">Merci de répondre à toutes les questions pour continuer.</div></div>'
      + '<div class="footer"><button class="btn btn-ghost" onclick="prev()">Retour</button>'
      + (isLastSection
          ? '<button class="btn btn-primary" id="btn-submit" onclick="validateSectionAndSubmit(' + sectionNum + ')">Envoyer mon avis</button>'
          : '<button class="btn btn-primary" onclick="validateSectionAndNext(' + sectionNum + ')">Continuer</button>')
      + '</div>';
  }
  else if(step === totalSteps - 1){
    html = '<div class="center-screen"><div class="check-circle">'
      + '<svg viewBox="0 0 24 24" fill="none" stroke="#F7DCDE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>'
      + '<p class="thanks-title">Merci pour votre avis</p>'
      + '<p class="thanks-sub">Votre évaluation a été transmise à l\'agence ' + (state.agence ? (AGENCES.find(function(a){return a.code===state.agence;})||{}).nom : '') + '.</p>'
      + '<p class="thanks-slogan">La satisfaction de chaque client, notre priorité</p></div>';
  }
  content.innerHTML = html;
}

function selectAgence(code){
  if(state.agence !== code){ state.agence = code; state.conseiller = ''; }
  document.getElementById('err-agence').style.display = 'none';
  render();
}
function validateAgence(){
  if(!state.agence){ document.getElementById('err-agence').style.display = 'block'; return; }
  next();
}
function validateSectionAndNext(n){
  if(!validateSection(n)){
    const err = document.getElementById('err-section');
    if(err) err.style.display = 'block';
    return;
  }
  next();
}
function validateSectionAndSubmit(n){
  if(!validateSection(n)){
    const err = document.getElementById('err-section');
    if(err) err.style.display = 'block';
    return;
  }
  submitReponse();
}
function next(){ if(step < totalSteps-1){ step++; render(); } }
function prev(){ if(step > 0){ step--; render(); } }

function submitReponse(){
  if(submitting) return;
  submitting = true;
  const btn = document.getElementById('btn-submit');
  if(btn){ btn.disabled = true; btn.textContent = 'Envoi en cours…'; }

  const payload = {
    agenceCode: state.agence,
    conseiller: state.conseiller,
    notes: state.notes,
    reponses: state.reponses
  };

  fetch(WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
    .then(function(){ submitting = false; next(); }) le 
    .catch(function(err){
      submitting = false;
      console.error('Échec réseau à l\'envoi :', err);
      if(btn){ btn.disabled = false; btn.textContent = 'Envoyer mon avis'; }
      alert('L\'envoi a échoué (problème réseau). Réessaie.');
    });

}
  
render();
</script>
</body>
</html>

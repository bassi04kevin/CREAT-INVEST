<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREA INVEST — Votre avis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --teal-900:#0C3B37; --teal-700:#125E56; --teal-500:#1E7F73;
    --gold-500:#CB9B3F; --gold-100:#F3E6C8; --cream-50:#F4F1E8; --paper:#FFFFFF;
    --ink-900:#1B2624; --ink-500:#6B7A76; --ink-300:#9AA6A2; --mint-50:#EAF3F0;
    --line:#DFE6E2; --danger:#B54A3C;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{font-family:'Inter',sans-serif;background:var(--cream-50);margin:0;color:var(--ink-900);display:flex;justify-content:center;}
  .app{width:100%;max-width:480px;min-height:100vh;background:var(--paper);display:flex;flex-direction:column;}
  .header{background:var(--teal-900);padding:22px 22px 20px;flex-shrink:0;}
  .header .brand{font-family:'Sora',sans-serif;font-size:13px;font-weight:600;color:var(--gold-100);letter-spacing:0.04em;margin-bottom:6px;}
  .header .title{font-family:'Sora',sans-serif;font-size:20px;font-weight:600;color:#fff;line-height:1.3;}
  .progress{display:flex;gap:5px;padding:14px 22px 0;flex-shrink:0;}
  .progress .dot{height:4px;flex:1;background:var(--line);border-radius:2px;overflow:hidden;}
  .progress .dot.filled{background:var(--gold-500);}
  .body{padding:22px;flex:1;}
  .step-label{font-size:12px;color:var(--ink-500);font-weight:500;margin-bottom:4px;}
  .agence-list{display:flex;flex-direction:column;gap:10px;}
  .agence-item{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color .15s, background .15s;}
  .agence-item:hover{border-color:var(--teal-500);}
  .agence-item.selected{border-color:var(--gold-500);background:var(--gold-100);}
  .agence-icon{width:36px;height:36px;border-radius:10px;background:var(--mint-50);display:flex;align-items:center;justify-content:center;color:var(--teal-700);font-family:'Sora',sans-serif;font-weight:600;font-size:13px;flex-shrink:0;}
  .agence-item.selected .agence-icon{background:var(--gold-500);color:#fff;}
  .agence-name{font-weight:500;font-size:14.5px;}
  select.field{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14.5px;font-family:'Inter',sans-serif;color:var(--ink-900);outline:none;background:var(--paper);-webkit-appearance:none;appearance:none;}
  select.field:focus{border-color:var(--teal-500);}
  .hint{font-size:12px;color:var(--ink-500);margin-top:8px;line-height:1.5;}
  .section-eyebrow{font-family:'Sora',sans-serif;font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;color:var(--gold-500);margin-bottom:6px;}
  .criterion{margin-bottom:22px;}
  .criterion:last-child{margin-bottom:6px;}
  .crit-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;}
  .crit-name{font-weight:500;font-size:14px;}
  .crit-desc{font-size:12px;color:var(--ink-500);margin-bottom:10px;line-height:1.4;}
  .crit-value{font-family:'Sora',sans-serif;font-weight:600;font-size:14px;color:var(--teal-700);min-width:34px;text-align:right;}
  .gauge{position:relative;height:8px;background:var(--line);border-radius:4px;margin-bottom:2px;}
  .gauge-fill{position:absolute;left:0;top:0;bottom:0;background:var(--gold-500);border-radius:4px;transition:width .12s ease;}
  .gauge input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:8px;background:transparent;position:relative;z-index:2;margin:0;}
  .gauge input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--teal-700);cursor:pointer;margin-top:-5px;}
  .gauge input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--teal-700);cursor:pointer;}
  .gauge input[type=range]::-webkit-slider-runnable-track{height:8px;background:transparent;}
  .textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:14px;font-family:'Inter',sans-serif;resize:none;outline:none;}
  .textarea:focus{border-color:var(--teal-500);}
  .footer{padding:16px 22px 26px;flex-shrink:0;display:flex;gap:10px;border-top:1px solid var(--line);}
  .btn{font-family:'Sora',sans-serif;font-weight:600;font-size:14px;border-radius:12px;padding:13px 0;text-align:center;cursor:pointer;border:none;flex:1;transition:opacity .15s, transform .1s;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--teal-900);color:#fff;}
  .btn-primary:disabled{background:var(--line);color:var(--ink-300);cursor:not-allowed;}
  .btn-ghost{background:var(--mint-50);color:var(--teal-900);flex:0 0 96px;}
  .qr-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 30px;text-align:center;}
  .qr-title{font-family:'Sora',sans-serif;font-size:19px;font-weight:600;margin:0 0 8px;}
  .qr-sub{font-size:13px;color:var(--ink-500);line-height:1.5;max-width:280px;}
  .center-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;}
  .check-circle{width:64px;height:64px;border-radius:50%;background:var(--teal-900);display:flex;align-items:center;justify-content:center;margin-bottom:20px;}
  .check-circle svg{width:28px;height:28px;}
  .thanks-title{font-family:'Sora',sans-serif;font-size:19px;font-weight:600;margin:0 0 8px;}
  .thanks-sub{font-size:13.5px;color:var(--ink-500);line-height:1.55;max-width:280px;}
  .error-text{color:var(--danger);font-size:12px;margin-top:6px;display:none;}
</style>
</head>
<body>

<div class="app"><div id="content"></div></div>

<script>
// ---- Cible : le backend Apps Script (API only), pas un chargement de page ----
// ⚠️ REMPLACER par l'URL /exec obtenue après déploiement de Code_API.gs
const WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbx0bmt6ejzH-gLPw9m87r8UVRC9sLkPUKqmzAhz027LG32K0NdNMMqsroPdmS_wV1jSJg/exec';

const AGENCES = [
  { code: 'DLA-AK', nom: "Douala — Akwa" },
  { code: 'DLA-BP', nom: "Douala — Bonapriso" },
  { code: 'DLA-BB', nom: "Douala — Bonabéri" },
  { code: 'YDE',    nom: "Yaoundé (Obili)" },
  { code: 'BUE',    nom: "Buea (Great Soppo)" }
];
const CONSEILLERS = {
  'DLA-AK': ["Mpacko", "Dalle Ntone", "Bomba Osonga", "Banga Biyo'o", "Mbonjo Nkongo", "Nyebe Edoa", "Bohongoue", "Mendo Ndzana"],
  'DLA-BP': ["Ngo Njom", "Mefire Ngamchiana"],
  'DLA-BB': ["Kimoun Mfochi", "Mborong", "Anyangwe", "Nkantchoua", "Sava"],
  'YDE':    ["Kongsha", "Amayeme", "Yamagam", "Keyetat", "Nzali Mibe", "Tang Tsoule", "Minko", "Etta Barracle", "Fomkouong"],
  'BUE':    ["Fongang", "Sone Bettini", "Wahkun", "Melvis"]
};

const criteresI = [
  {id:'c1', name:"Proactivité à l'accueil", desc:'Prise en charge en moins de 30 secondes, réception debout'},
  {id:'c2', name:'Attitude', desc:'Sourire, écoute active, éloquence, langage commercial'},
  {id:'c3', name:'Posture hospitalière', desc:'Chaleur de l\'accueil, attention personnalisée au client'}
];
const criteresII = [
  {id:'c4', name:'Propreté physique', desc:'Tenue harmonisée et propre, badge visible'},
  {id:'c5', name:'Convivialité de l\'espace', desc:'Propreté des lieux, affichage à jour, espace accueillant'}
];
const criteresIII = [
  {id:'c6', name:'Maîtrise des produits', desc:'Connaissance de l\'offre, capacité à argumenter sans support'},
  {id:'c7', name:'Maîtrise du tarifaire', desc:'Explication des taux et conditions sans hésitation'}
];

const state = { agence: null, conseiller: '', notes: {c1:7,c2:7,c3:7,c4:7,c5:7,c6:7,c7:7}, commentaire: '' };
let step = 0, submitting = false;
const totalSteps = 8;

function progressHTML(current){
  let dots = '';
  for(let i=1;i<totalSteps;i++){ dots += `<div class="dot ${i<=current?'filled':''}"></div>`; }
  return `<div class="progress">${dots}</div>`;
}

function gaugeRow(crit){
  const val = state.notes[crit.id];
  return `<div class="criterion">
    <div class="crit-top"><span class="crit-name">${crit.name}</span><span class="crit-value" id="val-${crit.id}">${val}/10</span></div>
    <div class="crit-desc">${crit.desc}</div>
    <div class="gauge"><div class="gauge-fill" id="fill-${crit.id}" style="width:${val*10}%"></div>
    <input type="range" min="0" max="10" step="1" value="${val}" oninput="updateCrit('${crit.id}', this.value)"></div>
  </div>`;
}

function updateCrit(id, val){
  state.notes[id] = Number(val);
  document.getElementById('val-'+id).textContent = val+'/10';
  document.getElementById('fill-'+id).style.width = (val*10)+'%';
}

function conseillerOptions(){
  const liste = CONSEILLERS[state.agence] || [];
  let opts = `<option value="">Je ne connais pas son nom</option>`;
  liste.forEach(nom => { opts += `<option value="${nom}" ${state.conseiller===nom?'selected':''}>${nom}</option>`; });
  return opts;
}

function render(){
  const content = document.getElementById('content');
  let html = '';

  if(step === 0){
    html = `<div class="qr-wrap"><p class="qr-title">Votre avis compte</p>
      <p class="qr-sub">Merci de prendre 2 minutes pour évaluer votre expérience en agence aujourd'hui.</p></div>
      <div class="footer"><button class="btn btn-primary" onclick="next()">Commencer</button></div>`;
  }
  else if(step === 1){
    html = `<div class="header"><div class="brand">CREA INVEST · Votre avis</div>
      <div class="title">Quelle agence avez-vous visitée aujourd'hui ?</div></div>
      ${progressHTML(1)}
      <div class="body"><div class="step-label">Question 1 sur 7</div>
      <div class="agence-list">${AGENCES.map(a => `
        <div class="agence-item ${state.agence===a.code?'selected':''}" onclick="selectAgence('${a.code}')">
          <div class="agence-icon">${a.code.split('-')[0].slice(0,2)}</div><div class="agence-name">${a.nom}</div>
        </div>`).join('')}</div>
      <div class="error-text" id="err-agence">Sélectionnez votre agence pour continuer.</div></div>
      <div class="footer"><button class="btn btn-ghost" onclick="prev()">Retour</button>
      <button class="btn btn-primary" onclick="validateAgence()">Continuer</button></div>`;
  }
  else if(step === 2){
    html = `<div class="header"><div class="brand">CREA INVEST · Votre avis</div><div class="title">Qui vous a reçu(e) ?</div></div>
      ${progressHTML(2)}
      <div class="body"><div class="step-label">Question 2 sur 7</div>
      <select class="field" onchange="state.conseiller=this.value">${conseillerOptions()}</select>
      <div class="hint">Sélectionnez le nom si vous le connaissez.</div></div>
      <div class="footer"><button class="btn btn-ghost" onclick="prev()">Retour</button>
      <button class="btn btn-primary" onclick="next()">Continuer</button></div>`;
  }
  else if(step === 3 || step === 4 || step === 5){
    const groups = {
      3:{eyebrow:'Section I', label:'Accueil et posture', crits:criteresI, q:'Question 3 sur 7'},
      4:{eyebrow:'Section II', label:'Image et cadre', crits:criteresII, q:'Question 4 sur 7'},
      5:{eyebrow:'Section III', label:'Compétences métier', crits:criteresIII, q:'Question 5 sur 7'}
    };
    const g = groups[step];
    html = `<div class="header"><div class="brand">CREA INVEST · Votre avis</div><div class="title">${g.label}</div></div>
      ${progressHTML(step)}
      <div class="body"><div class="step-label">${g.q}</div><div class="section-eyebrow">${g.eyebrow}</div>
      ${g.crits.map(c => gaugeRow(c)).join('')}</div>
      <div class="footer"><button class="btn btn-ghost" onclick="prev()">Retour</button>
      <button class="btn btn-primary" onclick="next()">Continuer</button></div>`;
  }
  else if(step === 6){
    html = `<div class="header"><div class="brand">CREA INVEST · Votre avis</div><div class="title">Un commentaire à ajouter ?</div></div>
      ${progressHTML(6)}
      <div class="body"><div class="step-label">Question 6 sur 7 · Facultatif</div>
      <textarea class="textarea" placeholder="Dites-nous ce qui vous a marqué, en bien ou en mal…" oninput="state.commentaire=this.value">${state.commentaire}</textarea></div>
      <div class="footer"><button class="btn btn-ghost" onclick="prev()">Retour</button>
      <button class="btn btn-primary" id="btn-submit" onclick="submitReponse()">Envoyer mon avis</button></div>`;
  }
  else if(step === 7){
    html = `<div class="center-screen"><div class="check-circle">
      <svg viewBox="0 0 24 24" fill="none" stroke="#F3E6C8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
      <p class="thanks-title">Merci pour votre avis</p>
      <p class="thanks-sub">Votre évaluation a été transmise à l'agence ${state.agence ? (AGENCES.find(a=>a.code===state.agence)||{}).nom : ''}.</p></div>`;
  }
  content.innerHTML = html;
}

function selectAgence(code){
  if(state.agence !== code){ state.agence = code; state.conseiller = ''; }
  document.getElementById('err-agence').style.display = 'none';
  render();
}
function validateAgence(){
  if(!state.agence){ document.getElementById('err-agence').style.display = 'block'; return; }
  next();
}
function next(){ if(step < totalSteps-1){ step++; render(); } }
function prev(){ if(step > 0){ step--; render(); } }

function submitReponse(){
  if(submitting) return;
  submitting = true;
  const btn = document.getElementById('btn-submit');
  if(btn){ btn.disabled = true; btn.textContent = 'Envoi en cours…'; }

  const payload = {
    agenceCode: state.agence,
    conseiller: state.conseiller,
    notes: state.notes,
    commentaire: state.commentaire
  };

  // mode: 'no-cors' est nécessaire pour parler à un Web App Apps Script depuis un autre domaine.
  // Conséquence acceptée : on ne peut pas lire la réponse du serveur (réponse "opaque").
  // Le vrai test de fiabilité, c'est de vérifier la ligne dans le Sheet après coup.
  fetch(WEBAPP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
    .then(function(){ submitting = false; next(); })
    .catch(function(err){
      submitting = false;
      console.error('Échec réseau à l\'envoi :', err);
      if(btn){ btn.disabled = false; btn.textContent = 'Envoyer mon avis'; }
      alert('L\'envoi a échoué (problème réseau). Réessaie.');
    });
}

render();
</script>
</body>
</html>
